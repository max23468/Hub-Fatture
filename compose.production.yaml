name: hub-fatture-production

x-app-environment: &app-environment
  ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?}
  APP_BASE_URL: https://fatture.opik.net
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:?}
  APP_ENV: production
  APP_IMAGE_DIGEST: ${APP_IMAGE_DIGEST:?}
  APP_VERSION: ${APP_VERSION:-0.0.0}
  ARUBA_ACCOUNT_REFERENCE: ${ARUBA_ACCOUNT_REFERENCE:?}
  ARUBA_ACCOUNT_IDENTITY: ${ARUBA_ACCOUNT_IDENTITY:?}
  ARUBA_API_READ_INTERVAL_MS: ${ARUBA_API_READ_INTERVAL_MS:-6100}
  ARUBA_SUBMISSION_ENABLED: ${ARUBA_SUBMISSION_ENABLED:-false}
  BACKUP_RECEIPT_PATH: /app/operations/backup-receipt.json
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?}
  DATABASE_URL: postgres://hub_fatture:${POSTGRES_PASSWORD:?}@postgres:5432/hub_fatture
  DOCUMENT_STORAGE_ROOT: /app/storage/documents
  EBAY_ACCOUNT_REFERENCE: ${EBAY_ACCOUNT_REFERENCE:-botCF}
  EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
  EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
  EBAY_ENVIRONMENT: production
  EBAY_RUNAME: ${EBAY_RUNAME:-}
  SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
  SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
  SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
  SMTP_FROM: ${SMTP_FROM:?}
  SMTP_HOST: smtp.email.eu-milan-1.oci.oraclecloud.com
  SMTP_PASSWORD: ${SMTP_PASSWORD:?}
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_TRANSPORT: OCI_EMAIL_DELIVERY
  SMTP_USERNAME: ${SMTP_USERNAME:?}

x-app-security: &app-security
  cap_drop: [ALL]
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:mode=1777,size=64m

x-logging: &default-logging
  driver: local
  options:
    max-file: "5"
    max-size: 10m

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=16m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/shared-caddy/sites:/etc/caddy/sites:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/logs/caddy:/var/log/caddy
    networks: [frontend, shared-public-proxy]
    depends_on:
      app-web:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 192m
    logging: *default-logging

  app-web:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    <<: *app-security
    command:
      [
        "sh",
        "-c",
        "node build-server/db/migrate.js && exec node node_modules/@react-router/serve/bin.cjs ./build/server/index.js",
      ]
    environment: *app-environment
    volumes:
      - ./data/documents:/app/storage/documents
      - ./data/operations:/app/operations:ro
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: 0.35
    mem_limit: 768m
    logging: *default-logging

  app-worker:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    <<: *app-security
    command: ["node", "build-server/worker.js"]
    stop_grace_period: 3m
    environment: *app-environment
    volumes:
      - ./data/documents:/app/storage/documents
      - ./data/operations:/app/operations:ro
    networks: [frontend, backend]
    depends_on:
      app-web:
        condition: service_healthy
    cpus: 0.3
    mem_limit: 768m
    logging: *default-logging

  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    restart: unless-stopped
    user: "999:999"
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: hub_fatture
      POSTGRES_USER: hub_fatture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /var/run/postgresql:uid=999,gid=999,mode=775,size=16m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_fatture -d hub_fatture"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 128m
    cpus: 0.5
    mem_limit: 2g
    logging: *default-logging

networks:
  frontend: {}
  backend:
    internal: true
  shared-public-proxy:
    external: true
    name: sequent-proxy

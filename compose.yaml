name: hub-fatture-development

x-app-environment: &app-environment
  ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
  APP_BASE_URL: http://localhost:8080
  APP_ENV: development
  ARUBA_ACCOUNT_REFERENCE: ${ARUBA_ACCOUNT_REFERENCE:-synthetic-aruba-account}
  ARUBA_SUBMISSION_ENABLED: "false"
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
  DATABASE_URL: postgres://hub_fatture:hub_fatture_local@postgres:5432/hub_fatture
  DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-storage/documents}
  EBAY_ACCOUNT_REFERENCE: ${EBAY_ACCOUNT_REFERENCE:-botCF}
  EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
  EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
  EBAY_ENVIRONMENT: ${EBAY_ENVIRONMENT:-sandbox}
  EBAY_RUNAME: ${EBAY_RUNAME:-}
  SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
  SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
  SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
  SMTP_FROM: ${SMTP_FROM:-contabilita@example.invalid}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_TRANSPORT: ${SMTP_TRANSPORT:-SYNTHETIC}
  SMTP_USERNAME: ${SMTP_USERNAME:-}

services:
  app:
    build:
      context: .
      target: development
    image: hub-fatture-app:local
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run db:migrate && npm run dev -- --host 0.0.0.0"]
    environment: *app-environment
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app-worker:
    build:
      context: .
      target: development
    image: hub-fatture-app:local
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run db:migrate && npm run dev:worker"]
    environment: *app-environment
    volumes:
      - .:/workspace
      - worker_node_modules:/workspace/node_modules
      - worker_build_server:/workspace/build-server
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub_fatture
      POSTGRES_USER: hub_fatture
      POSTGRES_PASSWORD: hub_fatture_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_fatture -d hub_fatture"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    init: true
    profiles: [test]
    environment:
      POSTGRES_DB: hub_fatture_test
      POSTGRES_USER: hub_fatture
      POSTGRES_PASSWORD: hub_fatture_test
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_fatture -d hub_fatture_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./ops/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_node_modules:
  worker_node_modules:
  worker_build_server:
  postgres_data:

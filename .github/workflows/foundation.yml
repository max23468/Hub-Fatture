name: Foundation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
      - name: Verifica repository e documentazione
        # Le guardie su contenuto tracciato vivono in scripts/repository-content.node-test.mjs,
        # dove il codice di uscita di `git grep` è ispezionabile invece di essere appiattito da `!`.
        run: |
          test -f AGENTS.md
          test -f docs/Hub_Fatture_MASTER_PLAN.md
          test -f ops/secrets/oci-vps-access.key.age
          test ! -e LICENSE
          git diff-tree --check --no-commit-id --root -r HEAD
      - name: Verifica titolo PR in formato Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PULL_REQUEST_TITLE" \
            | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9 /_-]+\))?!?: .+' \
            || { echo "Titolo PR non in formato Conventional Commit: $PULL_REQUEST_TITLE"; exit 1; }
      - name: Verifica gate Codex
        run: node --test scripts/codex-review-gate.test.mjs
      - name: Verifica toolchain
        run: |
          test -f mise.toml
          test -f package-lock.json
          test -f compose.yaml
          test -f Dockerfile
          test -f doctor.config.json
          test -f .github/workflows/react-doctor.yml
          node scripts/toolchain-policy.mjs
      - name: Verifica xmllint nell'immagine app
        run: |
          docker build --tag hub-fatture-app:foundation .
          docker run --rm hub-fatture-app:foundation xmllint --version

name: Foundation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Nessuno step esegue Node: i controlli sulla toolchain vivono in `npm run check`,
      # qui restano soltanto guardie di shell sul contenuto della repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - name: Verifica repository e documentazione
        # Le guardie su contenuto tracciato vivono in scripts/repository-content.node-test.mjs,
        # dove il codice di uscita di `git grep` è ispezionabile invece di essere appiattito da `!`.
        # I file letti da scripts/toolchain-policy.mjs non si ripetono qui: quello script
        # fallisce già se mancano, ed è `npm run check` a eseguirlo.
        run: |
          test -f AGENTS.md
          test -f docs/Hub_Fatture_MASTER_PLAN.md
          test -f ops/secrets/oci-vps-access.key.age
          test -f doctor.config.json
          test -f .github/workflows/react-doctor.yml
          test ! -e LICENSE
          git diff-tree --check --no-commit-id --root -r HEAD
      - name: Verifica titolo PR in formato Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PULL_REQUEST_TITLE" \
            | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9 /_-]+\))?!?: .+' \
            || { echo "Titolo PR non in formato Conventional Commit: $PULL_REQUEST_TITLE"; exit 1; }
      - name: Classifica l'impatto
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- scripts/change-impact.mjs | grep -Fxq scripts/change-impact.mjs; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/change-impact.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Verifica xmllint nell'immagine app
        if: steps.impact.outputs.image == 'true'
        run: |
          docker build --tag hub-fatture-app:foundation .
          docker run --rm hub-fatture-app:foundation xmllint --version

name: Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit di main da distribuire
        required: true
        type: string
      backup_only:
        description: Crea e verifica un backup del candidato live senza ridistribuirlo
        required: false
        default: false
        type: boolean
      publish_release:
        description: Pubblica la GitHub Release immutabile dopo il readback Production (autorizzazione esplicita)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read

concurrency:
  group: hub-fatture-production
  cancel-in-progress: false

jobs:
  candidate:
    name: Classifica candidato Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      base: ${{ steps.impact.outputs.base }}
      check_base: ${{ steps.impact.outputs.check_base }}
      rollback: ${{ steps.impact.outputs.rollback }}
      runtime: ${{ steps.impact.outputs.runtime }}
      image: ${{ steps.impact.outputs.image }}
      backup: ${{ steps.impact.outputs.migration_storage }}
      lane: ${{ steps.impact.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 600 scripts/change-impact.mjs scripts/commit-checks.mjs \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
          install -m 700 scripts/production-workflow.sh \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - name: Verifica candidato già presente in main
        id: candidate
        env:
          CANDIDATE: ${{ inputs.commit }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh candidate"
      - name: Verifica versione prima del deploy
        if: ${{ inputs.publish_release && !inputs.backup_only }}
        env:
          CANDIDATE: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh release-preflight"
      - name: Trova l'ultimo commit distribuito con successo
        id: impact
        env:
          CANDIDATE: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_TOOLING: ${{ runner.temp }}/hub-fatture-production-tooling
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh impact"
      - name: Riepiloga il perimetro Production
        env:
          LANE: ${{ steps.impact.outputs.lane }}
          RUNTIME: ${{ steps.impact.outputs.runtime }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh summary"

  checks:
    name: Gate exact-SHA
    if: >-
      !inputs.backup_only &&
      (needs.candidate.outputs.runtime == 'true' ||
       needs.candidate.outputs.commit == needs.candidate.outputs.base)
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 600 scripts/change-impact.mjs scripts/commit-checks.mjs \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Attendi i gate del commit esatto
        env:
          BASE: ${{ needs.candidate.outputs.check_base }}
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/hub-fatture-production-tooling/commit-checks.mjs"

  image:
    name: Build, scan e attestazione
    if: >-
      !inputs.backup_only &&
      (needs.candidate.outputs.image == 'true' ||
       needs.candidate.outputs.commit == needs.candidate.outputs.base)
    needs: candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 700 scripts/production-workflow.sh \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attendi e riusa l'artefatto verificato costruito al merge
        id: reuse
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY: ${{ needs.candidate.outputs.commit == needs.candidate.outputs.base }}
          ROLLBACK: ${{ needs.candidate.outputs.rollback }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh reuse-artifact"
      - name: Pubblica una sola immagine ARM64 come fallback
        if: steps.reuse.outputs.reused != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: APP_COMMIT_SHA=${{ needs.candidate.outputs.commit }}
          tags: ghcr.io/max23468/hub-fatture:sha-${{ needs.candidate.outputs.commit }}
          cache-from: type=gha,scope=hub-fatture-production
          cache-to: type=gha,mode=max,scope=hub-fatture-production
      - name: Blocca vulnerabilità alte e critiche
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/max23468/hub-fatture@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Attesta il digest pubblicato
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/max23468/hub-fatture
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy e readback
    if: >-
      always() &&
      (inputs.backup_only ||
        (!inputs.backup_only &&
         needs.checks.result == 'success' &&
         needs.image.result == 'success' &&
         (needs.candidate.outputs.runtime == 'true' ||
          needs.candidate.outputs.commit == needs.candidate.outputs.base)))
    needs: [candidate, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://fatture.opik.net
    permissions:
      attestations: read
      contents: read
      deployments: write
      id-token: write
      packages: read
    outputs:
      live_digest: ${{ steps.release_state.outputs.live_digest }}
      rollback: ${{ steps.baseline.outputs.rollback }}
      rollback_digest: ${{ steps.release_state.outputs.rollback_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 700 scripts/production-workflow.sh \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ !inputs.backup_only }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica attestazione del digest
        if: ${{ !inputs.backup_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: oci://ghcr.io/max23468/hub-fatture@${{ needs.image.outputs.digest }}
        run: gh attestation verify "$IMAGE" --repo "$GITHUB_REPOSITORY"
      - name: Prepara accesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh prepare-ssh"
      - name: Verifica e riconcilia la baseline live
        id: baseline
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          CANDIDATE_RUNTIME: ${{ needs.candidate.outputs.runtime }}
          BACKUP_ONLY: ${{ inputs.backup_only }}
          EXPECTED_BASE: ${{ needs.candidate.outputs.base }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK: ${{ needs.candidate.outputs.rollback }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh baseline"
      - name: Crea il backup richiesto del candidato live
        if: inputs.backup_only
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh backup-readiness"
      - name: Blocca rollback con schema divergente
        if: ${{ !inputs.backup_only && steps.baseline.outputs.deploy_runtime == 'true' }}
        env:
          ROLLBACK: ${{ steps.baseline.outputs.rollback }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh rollback-preflight"
      - name: Crea il deployment per il candidato esatto
        if: ${{ !inputs.backup_only && steps.baseline.outputs.deploy_runtime == 'true' }}
        id: deployment
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh create-deployment"
      - name: Installa artefatti e distribuisci il digest
        if: ${{ !inputs.backup_only && steps.baseline.outputs.deploy_runtime == 'true' }}
        env:
          BACKUP_REQUIRED: ${{ needs.candidate.outputs.backup }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh install-candidate"
      - name: Pubblica eventuali anomalie operative
        if: ${{ !inputs.backup_only && steps.baseline.outputs.deploy_runtime == 'true' }}
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: ssh "$SSH_USER@$SSH_HOST" "sudo /opt/hub-fatture/scripts/monitor-local.sh --report-only"
      - name: Ricevuta finale
        if: ${{ !inputs.backup_only && steps.baseline.outputs.deploy_runtime == 'true' }}
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: ssh "$SSH_USER@$SSH_HOST" "sudo cat /opt/hub-fatture/data/operations/deploy-receipt.json"
      - name: Registra il candidato distribuito con successo
        if: ${{ !inputs.backup_only && steps.baseline.outputs.deploy_runtime == 'true' }}
        env:
          DEPLOYMENT: ${{ steps.deployment.outputs.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh register-deployment"
      - name: Rilegge lo stato live per la release
        if: ${{ !inputs.backup_only }}
        id: release_state
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh release-state"

  release:
    name: GitHub Release immutabile
    if: >-
      always() &&
      inputs.publish_release &&
      !inputs.backup_only &&
      needs.deploy.outputs.rollback != 'true' &&
      needs.deploy.result == 'success'
    needs: [candidate, image, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 700 scripts/production-workflow.sh \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Prepara e pubblica la release dal readback verificato
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.deploy.outputs.live_digest }}
          ROLLBACK_DIGEST: ${{ needs.deploy.outputs.rollback_digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: "$RUNNER_TEMP/hub-fatture-production-tooling/production-workflow.sh publish-release"

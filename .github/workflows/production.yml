name: Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit di main da distribuire
        required: true
        type: string
      backup_only:
        description: Crea e verifica un backup del candidato live senza ridistribuirlo
        required: false
        default: false
        type: boolean
      publish_release:
        description: Pubblica la GitHub Release immutabile dopo il readback Production
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  deployments: read

concurrency:
  group: hub-fatture-production
  cancel-in-progress: false

jobs:
  candidate:
    name: Classifica candidato Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      base: ${{ steps.impact.outputs.base }}
      check_base: ${{ steps.impact.outputs.check_base }}
      rollback: ${{ steps.impact.outputs.rollback }}
      runtime: ${{ steps.impact.outputs.runtime }}
      image: ${{ steps.impact.outputs.image }}
      backup: ${{ steps.impact.outputs.migration_storage }}
      lane: ${{ steps.impact.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 600 scripts/change-impact.mjs scripts/commit-checks.mjs \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - name: Verifica candidato già presente in main
        id: candidate
        env:
          CANDIDATE: ${{ inputs.commit }}
        run: |
          git fetch --no-tags origin main
          git cat-file -e "$CANDIDATE^{commit}"
          test "$(git rev-parse "$CANDIDATE")" = "$CANDIDATE"
          git merge-base --is-ancestor "$CANDIDATE" origin/main
          git checkout --detach "$CANDIDATE"
          echo "commit=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Trova l'ultimo commit distribuito con successo
        id: impact
        env:
          CANDIDATE: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find_successful_base() {
            while IFS=$'\t' read -r deployment sha; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=1" --jq '.[0].state // ""')
              if [ "$state" = "success" ]; then
                printf '%s\n' "$sha"
                return
              fi
            done < <(gh api "$1" --jq '.[] | [.id, .sha] | @tsv')
          }
          github_base=$(find_successful_base "repos/$GITHUB_REPOSITORY/deployments?environment=Production&task=hub-fatture-production&per_page=100")
          base=$github_base
          if [ -z "$base" ]; then
            base=0000000000000000000000000000000000000000
            check_base=$base
            rollback=false
            impact_base=$base
            impact_head=$CANDIDATE
          elif git merge-base --is-ancestor "$base" "$CANDIDATE"; then
            check_base=$base
            rollback=false
            impact_base=$base
            impact_head=$CANDIDATE
          elif git merge-base --is-ancestor "$CANDIDATE" "$base"; then
            check_base=0000000000000000000000000000000000000000
            rollback=true
            impact_base=$CANDIDATE
            impact_head=$base
          else
            echo "Il candidato e il deployment corrente non appartengono alla stessa linea di main." >&2
            exit 1
          fi
          {
            echo "base=$base"
            echo "check_base=$check_base"
            echo "rollback=$rollback"
            node "$RUNNER_TEMP/hub-fatture-production-tooling/change-impact.mjs" "$impact_base" "$impact_head"
          } >> "$GITHUB_OUTPUT"
      - name: Riepiloga il perimetro Production
        env:
          LANE: ${{ steps.impact.outputs.lane }}
          RUNTIME: ${{ steps.impact.outputs.runtime }}
        run: |
          echo "Corsia dal commit distribuito - $LANE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNTIME" != "true" ]; then
            echo "Nessun artefatto runtime modificato: deploy non applicabile." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: Gate exact-SHA
    if: needs.candidate.outputs.runtime == 'true' && !inputs.backup_only
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conserva il tooling della revisione fidata
        run: |
          install -d -m 700 "$RUNNER_TEMP/hub-fatture-production-tooling"
          install -m 600 scripts/change-impact.mjs scripts/commit-checks.mjs \
            "$RUNNER_TEMP/hub-fatture-production-tooling/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Attendi i gate del commit esatto
        env:
          BASE: ${{ needs.candidate.outputs.check_base }}
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/hub-fatture-production-tooling/commit-checks.mjs"

  image:
    name: Build, scan e attestazione
    if: needs.candidate.outputs.image == 'true' && !inputs.backup_only
    needs: candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attendi e riusa l'artefatto verificato costruito al merge
        id: reuse
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK: ${{ needs.candidate.outputs.rollback }}
        run: |
          artifact_run=
          artifact_done=false
          if [ "$ROLLBACK" = true ]; then
            artifact_done=true
          else
            for _ in $(seq 1 120); do
              if [ -z "$artifact_run" ]; then
                artifact_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production-artifact.yml/runs?head_sha=$CANDIDATE&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
              fi
              if [ -n "$artifact_run" ]; then
                read -r status conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run" --jq '[.status, (.conclusion // "")] | @tsv')
                if [ "$status" = completed ]; then
                  test "$conclusion" = success || {
                    echo "Il workflow Production artifact $artifact_run è terminato con $conclusion." >&2
                    exit 1
                  }
                  artifact_done=true
                  break
                fi
              fi
              sleep 10
            done
          fi
          test "$artifact_done" = true || {
            echo "Il workflow Production artifact non si è concluso entro venti minuti." >&2
            exit 1
          }
          tag="ghcr.io/max23468/hub-fatture:sha-$CANDIDATE"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            && gh attestation verify "oci://ghcr.io/max23468/hub-fatture@$digest" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reused=false" >> "$GITHUB_OUTPUT"
      - name: Pubblica una sola immagine ARM64 come fallback
        if: steps.reuse.outputs.reused != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: APP_COMMIT_SHA=${{ needs.candidate.outputs.commit }}
          tags: ghcr.io/max23468/hub-fatture:sha-${{ needs.candidate.outputs.commit }}
          cache-from: type=gha,scope=hub-fatture-production
          cache-to: type=gha,mode=max,scope=hub-fatture-production
      - name: Blocca vulnerabilità alte e critiche
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/max23468/hub-fatture@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Attesta il digest pubblicato
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/max23468/hub-fatture
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy e readback
    if: >-
      always() &&
      (inputs.backup_only ||
        (needs.candidate.outputs.runtime == 'true' &&
         needs.checks.result == 'success' &&
         needs.image.result == 'success') ||
        (!inputs.backup_only &&
         inputs.publish_release &&
         needs.candidate.outputs.runtime != 'true' &&
         needs.candidate.outputs.commit == needs.candidate.outputs.base))
    needs: [candidate, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://fatture.opik.net
    permissions:
      attestations: read
      contents: read
      deployments: write
      id-token: write
      packages: read
    outputs:
      live_digest: ${{ steps.baseline.outputs.live_digest }}
      rollback_digest: ${{ steps.baseline.outputs.rollback_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica attestazione del digest
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: oci://ghcr.io/max23468/hub-fatture@${{ needs.image.outputs.digest }}
        run: gh attestation verify "$IMAGE" --repo "$GITHUB_REPOSITORY"
      - name: Prepara accesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verifica e riconcilia la baseline live
        id: baseline
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          EXPECTED_BASE: ${{ needs.candidate.outputs.base }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          # La ricevuta VPS resta autorevole; la classificazione precedente usa soltanto
          # lo storico GitHub e non richiede accesso anticipato ai secret Production.
          # shellcheck disable=SC2029
          live_receipt=$(ssh "$SSH_USER@$SSH_HOST" "sudo cat /opt/hub-fatture/data/operations/deploy-receipt.json")
          live_base=$(printf '%s' "$live_receipt" | jq -er .commit)
          live_digest=$(printf '%s' "$live_receipt" | jq -er .imageDigest)
          rollback_digest=$(ssh "$SSH_USER@$SSH_HOST" "sudo sed -n 's/^APP_IMAGE_DIGEST=//p' /opt/hub-fatture/data/operations/rollback.env")
          printf '%s' "$live_base" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$live_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$rollback_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "live_digest=$live_digest" >> "$GITHUB_OUTPUT"
          echo "rollback_digest=$rollback_digest" >> "$GITHUB_OUTPUT"
          git cat-file -e "$live_base^{commit}"
          if [ "$live_base" != "$EXPECTED_BASE" ]; then
            deployment=$(jq -n --arg ref "$live_base" '{ref:$ref,environment:"Production",task:"hub-fatture-production",description:"Riconciliazione da ricevuta live verificata",auto_merge:false,required_contexts:[]}' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
            gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" -X POST -f state=success -f environment=Production -f environment_url=https://fatture.opik.net -f description="Baseline riconciliata dalla ricevuta live" >/dev/null
            if [ "$EXPECTED_BASE" = 0000000000000000000000000000000000000000 ]; then
              git merge-base --is-ancestor "$live_base" "$CANDIDATE"
            else
              git merge-base --is-ancestor "$EXPECTED_BASE" "$live_base"
              git merge-base --is-ancestor "$live_base" "$CANDIDATE"
            fi
          fi
          if [ "${{ inputs.backup_only }}" = true ]; then
            test "$live_base" = "$CANDIDATE" || {
              echo "Il backup readiness è ammesso soltanto per il commit live esatto." >&2
              exit 1
            }
          fi
          if [ "${{ needs.candidate.outputs.runtime }}" != true ]; then
            test "$live_base" = "$CANDIDATE" || {
              echo "Il recupero della release è ammesso soltanto per il commit live esatto." >&2
              exit 1
            }
          fi
      - name: Crea il backup richiesto del candidato live
        if: inputs.backup_only
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          schema=$(find migrations -maxdepth 1 -type f -name '*.sql' -print | sed 's#^.*/##' | sort | tail -n 1)
          remote_script="/tmp/hub-fatture-backup-$CANDIDATE.sh"
          scp scripts/backup.sh "$SSH_USER@$SSH_HOST:$remote_script"
          # La corsia non può usare il backup per un commit diverso dal runtime effettivamente distribuito.
          # shellcheck disable=SC2029
          receipt=$(ssh "$SSH_USER@$SSH_HOST" "set -e; trap 'rm -f \"$remote_script\"' EXIT; chmod 700 '$remote_script'; test \"\$(sudo jq -er .commit /opt/hub-fatture/data/operations/deploy-receipt.json)\" = '$CANDIDATE'; sudo env HUB_FATTURE_ROOT=/opt/hub-fatture '$remote_script' readiness >/dev/null; sudo jq -cs '.[1] + {deployedImageDigest:.[0].imageDigest}' /opt/hub-fatture/data/operations/deploy-receipt.json /opt/hub-fatture/data/operations/backup-receipt.json")
          backup=$(printf '%s\n' "$receipt" | tail -n 1)
          printf '%s' "$backup" | jq -e --arg commit "$CANDIDATE" --arg version "$VERSION" --arg schema "$schema" '
            .status == "ok"
            and .commit == $commit
            and .version == $version
            and .schema == $schema
            and (.objectName | contains($commit))
            and (.imageDigest | test("^sha256:[0-9a-f]{64}$"))
            and .imageDigest == .deployedImageDigest
            and (.sha256 | test("^[0-9a-f]{64}$"))
            and (.sizeBytes > 0)
          ' >/dev/null
          printf 'Ricevuta backup verificata: %s\n' "$backup"
      - name: Blocca rollback con schema divergente
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        env:
          ROLLBACK: ${{ needs.candidate.outputs.rollback }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          if [ "$ROLLBACK" = true ]; then
            candidate_schema=$(find migrations -maxdepth 1 -type f -name '*.sql' -print | sed 's#^.*/##' | sort | tail -n 1)
            test -n "$candidate_schema"
            # shellcheck disable=SC2029
            deployed_schema=$(ssh "$SSH_USER@$SSH_HOST" "sudo jq -er .schema /opt/hub-fatture/data/operations/deploy-receipt.json")
            test "$candidate_schema" = "$deployed_schema" || {
              echo "Rollback vietato: lo schema Production è avanzato rispetto al candidato." >&2
              exit 1
            }
            if ! grep -Fq 'z.enum(["AUTOMATIC", "MANUAL", "DISABLED"])' src/db/email.server.ts; then
              # shellcheck disable=SC2029
              customer_email_mode=$(ssh "$SSH_USER@$SSH_HOST" "cd /opt/hub-fatture && sudo docker compose -f compose.yaml --env-file .env --env-file .deploy.env exec -T postgres psql -U hub_fatture -d hub_fatture -Atc \"SELECT value_json #>> '{}' FROM settings WHERE key = 'customer_email_mode'\"")
              test "$customer_email_mode" != "DISABLED" || {
                echo "Rollback vietato: il candidato non supporta la disattivazione delle e-mail al cliente attiva in Production." >&2
                exit 1
              }
            fi
          fi
      - name: Crea il deployment per il candidato esatto
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        id: deployment
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployment=$(jq -n --arg ref "$CANDIDATE" '{ref:$ref,environment:"Production",task:"hub-fatture-production",description:"Hub Fatture Production exact candidate",auto_merge:false,required_contexts:[]}' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "id=$deployment" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" -X POST -f state=in_progress -f environment=Production -f environment_url=https://fatture.opik.net -f description="Deploy exact-SHA in corso" >/dev/null
      - name: Installa artefatti e distribuisci il digest
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        env:
          BACKUP_REQUIRED: ${{ needs.candidate.outputs.backup }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          target="/tmp/hub-fatture-$COMMIT"
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" "install -d -m 700 '$target'"
          scp compose.production.yaml ops/Caddyfile.production ops/systemd/* \
            scripts/backup.sh scripts/monitor-local.sh scripts/restore.sh scripts/production-*.sh \
            scripts/read-env.sh \
            "$SSH_USER@$SSH_HOST:$target/"
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" "sudo chmod 750 '$target/'*.sh && sudo install -m 640 '$target/compose.production.yaml' /opt/hub-fatture/compose.yaml.next && sudo install -m 640 '$target/Caddyfile.production' /opt/hub-fatture/Caddyfile.next && if [ '$BACKUP_REQUIRED' = true ] && sudo test -f /opt/hub-fatture/.deploy.env && sudo test -f /opt/hub-fatture/data/operations/deploy-receipt.json; then sudo env HUB_FATTURE_ROOT=/opt/hub-fatture /opt/hub-fatture/scripts/backup.sh pre-deploy; elif sudo test -f /opt/hub-fatture/.deploy.env; then sudo jq -e '.status == \"ok\" and ((.completedAt | fromdateiso8601) >= (now - 129600))' /opt/hub-fatture/data/operations/backup-receipt.json >/dev/null; fi && sudo env HUB_FATTURE_CANDIDATE_DIR='$target' '$target/production-deploy.sh' '$DIGEST' '$COMMIT' '$VERSION' && sudo install -m 750 '$target/backup.sh' '$target/monitor-local.sh' '$target/read-env.sh' '$target/restore.sh' '$target/production-preflight.sh' '$target/production-readback.sh' '$target/production-release-candidate-readback.sh' '$target/production-deploy.sh' /opt/hub-fatture/scripts/ && sudo install -m 644 '$target/'*.service '$target/'*.timer /etc/systemd/system/ && if [ '$BACKUP_REQUIRED' = true ]; then sudo /opt/hub-fatture/scripts/backup.sh deploy; fi && sudo systemctl daemon-reload && sudo systemctl enable --now hub-fatture-backup.timer hub-fatture-monitor.timer && sudo /opt/hub-fatture/scripts/monitor-local.sh && rm -rf '$target'"
      - name: Ricevuta finale
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: ssh "$SSH_USER@$SSH_HOST" "sudo cat /opt/hub-fatture/data/operations/deploy-receipt.json"
      - name: Registra il candidato distribuito con successo
        if: ${{ !inputs.backup_only && needs.candidate.outputs.runtime == 'true' }}
        env:
          DEPLOYMENT: ${{ steps.deployment.outputs.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for delay in 0 2 5 10 20 30; do
            sleep "$delay"
            if gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses" -X POST -f state=success -f environment=Production -f environment_url=https://fatture.opik.net -f description="Deploy exact-SHA verificato" >/dev/null; then
              exit 0
            fi
            echo "Registrazione terminale non riuscita; nuovo tentativo tra poco." >&2
          done
          echo "Deploy live riuscito ma stato GitHub non registrato: la prossima esecuzione riconcilierà la ricevuta VPS." >&2
          exit 1

  release:
    name: GitHub Release immutabile
    if: >-
      always() &&
      inputs.publish_release &&
      !inputs.backup_only &&
      needs.candidate.outputs.rollback != 'true' &&
      needs.deploy.result == 'success'
    needs: [candidate, image, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Prepara e pubblica la release dal readback verificato
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest || needs.deploy.outputs.live_digest }}
          ROLLBACK_DIGEST: ${{ needs.deploy.outputs.rollback_digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          schema=$(find migrations -maxdepth 1 -type f -name '*.sql' -print | sed 's#^.*/##' | sort | tail -n 1)
          bundle_url=$(gh api "repos/$GITHUB_REPOSITORY/attestations/$IMAGE_DIGEST" --jq '.attestations[0].bundle_url // empty')
          attestation_id=$(node -e 'const match = new URL(process.argv[1]).pathname.match(/\/(\d+)(?:\.json\.sn)?\/?$/); if (!match) process.exit(1); process.stdout.write(match[1]);' "$bundle_url")
          printf '%s' "$attestation_id" | grep -Eq '^[0-9]+$'
          attestation="https://github.com/$GITHUB_REPOSITORY/attestations/$attestation_id"
          stage=$(mktemp -d "${RUNNER_TEMP}/hub-fatture-release.XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT HUP INT TERM
          node scripts/prepare-production-release.mjs "$stage" "$VERSION" "$COMMIT" \
            "$IMAGE_DIGEST" "$ROLLBACK_DIGEST" "$schema" "$attestation"
          scripts/publish-github-release.sh "v$VERSION" "$COMMIT" \
            "$stage/release-manifest.json" "$stage/release-notes.md"

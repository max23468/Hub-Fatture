name: Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit di main da distribuire
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: hub-fatture-production
  cancel-in-progress: false

jobs:
  candidate:
    name: Classifica candidato Production
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      base: ${{ steps.impact.outputs.base }}
      runtime: ${{ steps.impact.outputs.runtime }}
      image: ${{ steps.impact.outputs.image }}
      backup: ${{ steps.impact.outputs.migration_storage }}
      lane: ${{ steps.impact.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
      - name: Verifica candidato già presente in main
        id: candidate
        env:
          CANDIDATE: ${{ inputs.commit }}
        run: |
          git fetch --no-tags origin main
          git cat-file -e "$CANDIDATE^{commit}"
          test "$(git rev-parse "$CANDIDATE")" = "$CANDIDATE"
          git merge-base --is-ancestor "$CANDIDATE" origin/main
          git checkout --detach "$CANDIDATE"
          echo "commit=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Trova l'ultimo commit distribuito con successo
        id: impact
        env:
          CANDIDATE: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=
          while IFS=$'\t' read -r deployment sha; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then
              base=$sha
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
          if [ -z "$base" ]; then
            base=0000000000000000000000000000000000000000
          else
            git cat-file -e "$base^{commit}"
            git merge-base --is-ancestor "$base" "$CANDIDATE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          node scripts/change-impact.mjs "$base" "$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Riepiloga il perimetro Production
        env:
          LANE: ${{ steps.impact.outputs.lane }}
          RUNTIME: ${{ steps.impact.outputs.runtime }}
        run: |
          echo "Corsia dal commit distribuito - $LANE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNTIME" != "true" ]; then
            echo "Nessun artefatto runtime modificato: deploy non applicabile." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: Gate exact-SHA
    if: needs.candidate.outputs.runtime == 'true'
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
      - name: Attendi i gate del commit esatto
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/commit-checks.mjs

  image:
    name: Build, scan e attestazione
    if: needs.candidate.outputs.image == 'true'
    needs: candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Riusa l'artefatto verificato costruito al merge
        id: reuse
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ghcr.io/max23468/hub-fatture:sha-$CANDIDATE"
          for _ in 1 2 3 4 5 6; do
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
              && gh attestation verify "oci://ghcr.io/max23468/hub-fatture@$digest" --repo "$GITHUB_REPOSITORY" >/dev/null; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "reused=false" >> "$GITHUB_OUTPUT"
      - name: Pubblica una sola immagine ARM64 come fallback
        if: steps.reuse.outputs.reused != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: APP_COMMIT_SHA=${{ needs.candidate.outputs.commit }}
          tags: ghcr.io/max23468/hub-fatture:sha-${{ needs.candidate.outputs.commit }}
          cache-from: type=gha,scope=hub-fatture-production
          cache-to: type=gha,mode=max,scope=hub-fatture-production
      - name: Blocca vulnerabilità alte e critiche
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/max23468/hub-fatture@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Attesta il digest pubblicato
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-name: ghcr.io/max23468/hub-fatture
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy e readback
    if: >-
      always() &&
      needs.candidate.outputs.runtime == 'true' &&
      needs.checks.result == 'success' &&
      needs.image.result == 'success'
    needs: [candidate, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://fatture.opik.net
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica attestazione del digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: oci://ghcr.io/max23468/hub-fatture@${{ needs.image.outputs.digest }}
        run: gh attestation verify "$IMAGE" --repo "$GITHUB_REPOSITORY"
      - name: Prepara accesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Installa artefatti e distribuisci il digest
        env:
          BACKUP_REQUIRED: ${{ needs.candidate.outputs.backup }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          target="/tmp/hub-fatture-$COMMIT"
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" "install -d -m 700 '$target'"
          scp compose.production.yaml ops/Caddyfile.production ops/systemd/* \
            scripts/backup.sh scripts/monitor-local.sh scripts/restore.sh scripts/production-*.sh \
            scripts/read-env.sh \
            "$SSH_USER@$SSH_HOST:$target/"
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" "sudo chmod 750 '$target/'*.sh && sudo install -m 640 '$target/compose.production.yaml' /opt/hub-fatture/compose.yaml.next && sudo install -m 640 '$target/Caddyfile.production' /opt/hub-fatture/Caddyfile.next && if [ '$BACKUP_REQUIRED' = true ] && sudo test -f /opt/hub-fatture/.deploy.env && sudo test -f /opt/hub-fatture/data/operations/deploy-receipt.json; then sudo env HUB_FATTURE_ROOT=/opt/hub-fatture /opt/hub-fatture/scripts/backup.sh pre-deploy; elif sudo test -f /opt/hub-fatture/.deploy.env; then sudo jq -e '.status == \"ok\" and ((.completedAt | fromdateiso8601) >= (now - 129600))' /opt/hub-fatture/data/operations/backup-receipt.json >/dev/null; fi && sudo env HUB_FATTURE_CANDIDATE_DIR='$target' '$target/production-deploy.sh' '$DIGEST' '$COMMIT' '$VERSION' && sudo install -m 750 '$target/backup.sh' '$target/monitor-local.sh' '$target/read-env.sh' '$target/restore.sh' '$target/production-preflight.sh' '$target/production-readback.sh' '$target/production-release-candidate-readback.sh' '$target/production-deploy.sh' /opt/hub-fatture/scripts/ && sudo install -m 644 '$target/'*.service '$target/'*.timer /etc/systemd/system/ && if [ '$BACKUP_REQUIRED' = true ]; then sudo /opt/hub-fatture/scripts/backup.sh deploy; fi && sudo systemctl daemon-reload && sudo systemctl enable --now hub-fatture-backup.timer hub-fatture-monitor.timer && sudo /opt/hub-fatture/scripts/monitor-local.sh && rm -rf '$target'"
      - name: Ricevuta finale
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: ssh "$SSH_USER@$SSH_HOST" "sudo cat /opt/hub-fatture/data/operations/deploy-receipt.json"

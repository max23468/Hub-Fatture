name: Prepare release 0.3.53

on:
  push:
    branches: [agent/release-0.3.53]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/release-0.3.53
          fetch-depth: 0
      - name: Aggiorna versione e changelog
        run: |
          npm version 0.3.53 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("Intestazione changelog inattesa")
          entry = (
              "## 0.3.53\n\n"
              "- Le Impostazioni Aruba separano correttamente i tre comandi operativi, "
              "mantenendo spaziatura coerente anche quando vanno a capo.\n\n"
          )
          path.write_text(marker + entry + text[len(marker):])
          PY
          rm .github/workflows/prepare-release-0.3.53.yml
      - name: Commit candidato release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .github/workflows/prepare-release-0.3.53.yml
          git commit -m "chore: prepara la release 0.3.53"
          git push origin HEAD:agent/release-0.3.53

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- scripts/change-impact.mjs | grep -Fxq scripts/change-impact.mjs; then
            echo "react=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/change-impact.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - id: doctor
        if: steps.impact.outputs.react == 'true'
        uses: millionco/react-doctor@736abc183ac491b4e954fc6bedec3a9a1b73d38b # versione sintetica precedente per il gate M8
        with:
          version: latest
          scope: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
          blocking: warning
          comment: "false"
          review-comments: "true"
          commit-status: "false"
      - if: steps.impact.outputs.react != 'true'
        run: echo "React Doctor non applicabile a questa corsia."

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true
      - id: reuse
        if: github.event_name == 'push'
        env:
          CANDIDATE: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS_JSON: '["react-doctor"]'
        run: node scripts/check-reuse.mjs
      - id: impact
        if: steps.reuse.outputs.reused != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- scripts/change-impact.mjs | grep -Fxq scripts/change-impact.mjs; then
            echo "react=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/change-impact.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - id: doctor
        if: steps.reuse.outputs.reused != 'true' && steps.impact.outputs.react == 'true'
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          version: latest
          scope: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
          blocking: warning
          comment: "false"
          review-comments: "true"
          commit-status: "false"
      - if: steps.reuse.outputs.reused != 'true' && steps.impact.outputs.react != 'true'
        run: echo "React Doctor non applicabile a questa corsia."
      - if: steps.reuse.outputs.reused == 'true'
        run: echo "React Doctor riusato dalla PR con albero Git equivalente."

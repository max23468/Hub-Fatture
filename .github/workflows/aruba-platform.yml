name: Helper Aruba multipiattaforma

on:
  repository_dispatch:
    types: [aruba-platform-candidate]

permissions:
  checks: write
  contents: read

concurrency:
  group: aruba-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aruba-helper-platform:
    name: Esegui helper Aruba (${{ matrix.browser }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: chrome
          - os: windows-latest
            browser: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.client_payload.commit }}
      - name: Verifica il candidato esatto
        shell: bash
        env:
          CANDIDATE: ${{ github.event.client_payload.commit }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor "$CANDIDATE" origin/main
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - run: npm ci
      - run: npm run test:aruba:platform -- ${{ matrix.browser }}
      - name: Registra la ricevuta sul candidato
        if: always()
        shell: bash
        env:
          CANDIDATE: ${{ github.event.client_payload.commit }}
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          GH_TOKEN: ${{ github.token }}
          RECEIPT_NAME: Helper Aruba (${{ matrix.browser }} / ${{ matrix.os }})
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="$RECEIPT_NAME" \
            -f head_sha="$CANDIDATE" \
            -f status=completed \
            -f conclusion="$CONCLUSION"

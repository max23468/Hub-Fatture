name: Helper Aruba multipiattaforma

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aruba-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aruba-helper-platform:
    name: Helper Aruba (${{ matrix.browser }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: chrome
          - os: windows-latest
            browser: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
      - run: npm ci
      - run: npm run test:aruba:platform -- ${{ matrix.browser }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: hub_fatture_test
          POSTGRES_USER: hub_fatture
          POSTGRES_PASSWORD: hub_fatture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub_fatture -d hub_fatture_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_BOOTSTRAP_TOKEN: synthetic-bootstrap-token-for-tests
      APP_BASE_URL: http://127.0.0.1:4173
      APP_ENV: test
      DATABASE_URL: postgres://hub_fatture:hub_fatture_test@127.0.0.1:5432/hub_fatture_test
      TEST_DATABASE_URL: postgres://hub_fatture:hub_fatture_test@127.0.0.1:5432/hub_fatture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
